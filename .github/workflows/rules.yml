name: Weekly rules rebuild
on:
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: gitleaks-rules-update
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v16
        with:
          name: devenv
      - run: nix profile add nixpkgs#devenv
      - uses: ./.github/actions/setup-sandbox
      - run: devenv shell -- cargo run --locked --bin preflight-update-rules
      - run: devenv test
      - run: devenv shell -- cargo bench --locked --bench inspection
      - run: nix build .#preflight
      - run: nix build .#checks.x86_64-linux.preflight-vm --out-link result-vm
      - name: Export the package closure
        run: |
          nix-store --query --requisites result > "$RUNNER_TEMP/preflight-closure-paths"
          mapfile -t closure_paths < "$RUNNER_TEMP/preflight-closure-paths"
          nix-store --export "${closure_paths[@]}" | zstd -T0 -o preflight-closure.nar.zst
      - uses: actions/upload-artifact@v4
        with:
          name: preflight-weekly-provenance
          compression-level: 0
          path: |
            preflight-closure.nar.zst
            vendor/gitleaks/
            Cargo.lock
            flake.lock
      - name: Commit validated rules to main
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          git add -- vendor/gitleaks/gitleaks.toml vendor/gitleaks/LICENSE vendor/gitleaks/upstream.json
          if git diff --cached --quiet; then
            printf '%s\n' 'Gitleaks is already current. Validation and the weekly rebuild passed; no commit was needed.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # A moving main must be revalidated, never silently rebased or forced.
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          git config --local user.name 'Geoffrey Huntley'
          git config --local user.email 'ghuntley@ghuntley.com'
          git commit -m 'Update embedded Gitleaks database'
          git push origin HEAD:main

          # GITHUB_TOKEN pushes do not trigger push workflows; dispatch CI explicitly.
          gh workflow run ci.yml --repo "$GH_REPO" --ref main
          printf '%s\n' 'Updated Gitleaks on main and dispatched CI.' >> "$GITHUB_STEP_SUMMARY"
